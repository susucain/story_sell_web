server {
    listen 80;
    server_name storysell.cn www.storysell.cn;

    return 301 https://www.storysell.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name storysell.cn;

    ssl_certificate /etc/nginx/ssl/www.storysell.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.storysell.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.storysell.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.storysell.cn;

    ssl_certificate /etc/nginx/ssl/www.storysell.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.storysell.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/agui-frontend/current;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    client_max_body_size 50m;

    # index.html 不缓存，防止部署后浏览器使用旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ai {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 930s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oss {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /video {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 930s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
